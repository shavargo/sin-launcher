name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\sin-launcher.exe dist\sin-launcher.exe
          Compress-Archive -Path dist\sin-launcher.exe -DestinationPath "sin-launcher-$ver-windows-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sin-launcher-windows
          path: |
            dist/sin-launcher.exe
            sin-launcher-*-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sin-launcher.exe
            sin-launcher-*-windows-x64.zip
          generate_release_notes: true
